services:
  db:
    image: postgres:17
    container_name: doku_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: doku
      POSTGRES_USER: doku
      POSTGRES_PASSWORD: doku_dev_password   # développement uniquement
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - doku_pgdata:/var/lib/postgresql/data
volumes:
  doku_pgdata:
